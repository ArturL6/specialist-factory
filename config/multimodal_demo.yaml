task:
  name: damage_report
  modality: multimodal
  classes:
    - {name: scratch, description: "The image and report indicate visible surface damage."}
    - {name: clean, description: "The image and report indicate no visible surface damage."}
data_path: data/multimodal_demo.jsonl
run_dir: runs/multimodal_demo
cache_path: data/multimodal_teacher_cache.sqlite
teachers:
  - {id: mock_multimodal_a, type: mock, model_name: builtin/mock-multimodal-v1, weight: 1.0, modalities: [text, image], version: v2}
  - {id: mock_multimodal_b, type: mock, model_name: builtin/mock-multimodal-v1, weight: 0.9, modalities: [text, image], version: v2}
  # Documented external adapter: {id: vlm, type: openrouter_vision, model: <vision-model>, api_key_env: OPENROUTER_API_KEY, weight: 1.0, modalities: [text, image], version: v2}
aggregation: {method: weighted_mean, min_teacher_agreement: 0.5, min_confidence: 0.55}
student:
  input_modalities: [text, image]
  encoder: {type: late_fusion, output_dim: 16}
  head: {type: mlp, hidden_dim: 24, dropout: 0.1}
training: {epochs: 30, batch_size: 12, learning_rate: 0.01, alpha_human: 1.0, beta_teacher: 1.0, distillation_temperature: 2.0, accelerator: cpu, seed: 7}
