task:
  name: ecommerce_intent
  modality: text
  classes:
    - {name: order_status, description: "The user asks about the status of an existing order."}
    - {name: cancel_order, description: "The user wants to cancel an order."}
    - {name: refund, description: "The user wants their money back."}
    - {name: other, description: "None of the other classes applies."}
data_path: data/text_demo.jsonl
run_dir: runs/text_demo
cache_path: data/text_teacher_cache.sqlite
teachers:
  - {id: mock_text_a, type: mock, model_name: builtin/mock-text-v1, weight: 1.0, modalities: [text], version: v2}
  - {id: mock_text_b, type: mock, model_name: builtin/mock-text-v1, weight: 0.9, modalities: [text], version: v2}
  # Production alternative: {id: hf_text, type: huggingface_text, model_name: facebook/bart-large-mnli, weight: 1.0, modalities: [text], version: v2}
aggregation: {method: weighted_mean, min_teacher_agreement: 0.5, min_confidence: 0.55}
student:
  input_modalities: [text]
  encoder: {type: tiny_text, output_dim: 32}
  head: {type: mlp, hidden_dim: 32, dropout: 0.1}
training: {epochs: 30, batch_size: 12, learning_rate: 0.01, alpha_human: 1.0, beta_teacher: 1.0, distillation_temperature: 2.0, accelerator: cpu, seed: 7}
