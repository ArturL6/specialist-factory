[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specialist-factory"
version = "0.1.0"
description = "Compact teacher-to-specialist multimodal training POC"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pillow>=10,<12",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "requests>=2.31,<3",
  "torch>=2.2,<3",
  "lightning>=2.2,<3",
  "torchmetrics>=1.3,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
hf = ["transformers>=4.40,<6", "datasets>=2.19,<4"]
dev = ["pytest>=8,<9", "ruff>=0.4,<1"]

[project.scripts]
specialist-factory = "specialist_factory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
